<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>에러안내</title>
	<script src="/resources/cms/js/jquery-3.5.1.min.js"></script>
	<script>
	$(function(){
		var isAlert = 'true';
		var msg = '게시글에 대한 정보가 없습니다.';
		var returnUrl = 'javascript:history.back();';
		if (isAlert == 'true') {
			alert(msg);
		}
		location.href = returnUrl;
	});
	</script>
</head>
<body>
<noscript>에러안내 : 게시글에 대한 정보가 없습니다. <a href="javascript:history.back();">되돌아가기</a></noscript>
</body>
</html>
